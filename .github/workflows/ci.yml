name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Africa/Douala
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BACKEND_PORT: '4000'
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint src --quiet
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx next build
